<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050607"><link rel="icon" href="data:,"><link rel="manifest" href="/manifest.webmanifest"><title>雷电低延迟远控</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}#video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;touch-action:none;-webkit-user-select:none}#login{position:fixed;inset:0;z-index:20;display:grid;place-content:center;padding:24px;background:#080a0d}.card{width:min(390px,86vw)}h1{font-size:24px;margin:0 0 18px}input,button{width:100%;border:0;border-radius:14px;font:inherit}input{padding:15px;background:#fff;color:#111;font-size:24px;letter-spacing:6px}button{padding:14px;background:#eee;color:#111;margin-top:12px;font-size:17px}#status{display:block;min-height:72px;margin-top:16px;line-height:1.55;color:#b9c0ca;white-space:pre-line}#orb{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));z-index:10;width:52px;height:52px;border-radius:50%;padding:0;margin:0;background:#15231dcc;color:#fff;border:1px solid #ffffff22}#orb.online{background:#168747dd}#menu{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(86px,calc(env(safe-area-inset-bottom) + 62px));z-index:9;display:none;grid-template-columns:repeat(2,88px);gap:7px;padding:8px;border-radius:17px;background:#101318df;backdrop-filter:blur(16px)}#menu button{margin:0;background:#292e36;color:#fff;font-size:14px;padding:12px 4px}#latencyPanel{position:fixed;z-index:12;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:none;width:min(330px,calc(100vw - 24px));padding:14px 15px;border:1px solid #ffffff22;border-radius:16px;background:#0d1117e8;backdrop-filter:blur(18px);font-size:13px;color:#dce3ec}#latencyPanel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}#latencyPanel strong{font-size:16px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px}.metric{display:flex;justify-content:space-between;gap:8px}.metric span:first-child{color:#8994a3}.metric .good{color:#54d98c}.metric .warn{color:#ffd166}.metric .bad{color:#ff6b6b}#latencyPath{margin-top:10px;padding-top:9px;border-top:1px solid #ffffff18;color:#9ba7b5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#latencyNote{margin-top:7px;color:#7f8a98;line-height:1.35}#keyboard{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:30;display:none;gap:7px;padding:8px;background:#101318ee;border-radius:15px}#keyboard input{min-width:0;flex:1;font-size:16px;letter-spacing:0;padding:11px}#keyboard button{width:auto;margin:0;padding:0 15px;background:#2865dc;color:#fff}</style></head>
<body><video id="video" autoplay muted playsinline webkit-playsinline></video>
<section id="login"><div class="card"><h1>雷电低延迟远控 v3</h1><input id="pin" inputmode="text" autocomplete="current-password" autocapitalize="none" spellcheck="false" maxlength="64" placeholder="输入访问密码"><button id="connect">连接</button><span id="status">通过 Tailscale、蒲公英或局域网访问后输入密码</span></div></section>
<button id="orb">●</button><div id="menu"><button data-key="4">返回</button><button data-key="3">主页</button><button data-key="187">最近</button><button id="keyboardBtn">键盘</button><button data-key="24">音量＋</button><button data-key="25">音量－</button><button id="wake">唤醒</button><button id="rotate">旋转</button><button id="latencyBtn">实时延迟</button><button id="full">全屏</button><button id="retry">重连</button></div>
<aside id="latencyPanel"><header><strong>实时连接质量</strong><span id="latencyQuality">等待数据</span></header><div class="metric-grid"><div class="metric"><span>操作 RTT</span><span id="appRtt">--</span></div><div class="metric"><span>WebRTC RTT</span><span id="rtcRtt">--</span></div><div class="metric"><span>瞬时丢包</span><span id="packetLoss">--</span></div><div class="metric"><span>网络抖动</span><span id="jitter">--</span></div><div class="metric"><span>接收码率</span><span id="bitrate">--</span></div><div class="metric"><span>解码帧率</span><span id="decodeFps">--</span></div><div class="metric"><span>接收缓冲</span><span id="jitterBuffer">--</span></div><div class="metric"><span>单帧解码</span><span id="decodeTime">--</span></div></div><div id="latencyPath">路径：等待 ICE 候选</div><div id="latencyNote">说明：RTT 是往返耗时；“接收缓冲”不等于完整的端到端画面延迟。</div></aside>
<div id="keyboard"><input id="text" placeholder="输入文字"><button id="sendText">发送</button><button id="closeKeyboard">关闭</button></div>
<script>
const video=document.querySelector('#video'),login=document.querySelector('#login'),statusEl=document.querySelector('#status'),orb=document.querySelector('#orb'),menu=document.querySelector('#menu'),latencyPanel=document.querySelector('#latencyPanel');let pc,dc,pin,firstFrameTimer,reportTimers=[],statsTimer,pingTimer,reportLogTimer,lastStats,appRttMs;
const show=s=>statusEl.textContent=s;const send=s=>{if(dc?.readyState==='open'){dc.send(s);return true}show('控制通道尚未连接');return false};
const metric=(id,value,level='')=>{let el=document.querySelector('#'+id);el.textContent=value;el.className=level};
const level=(value,warn,bad)=>!Number.isFinite(value)?'':value>=bad?'bad':value>=warn?'warn':'good';
function resetDiagnostics(){clearInterval(statsTimer);clearInterval(pingTimer);clearInterval(reportLogTimer);lastStats=null;appRttMs=undefined;['appRtt','rtcRtt','packetLoss','jitter','bitrate','decodeFps','jitterBuffer','decodeTime'].forEach(id=>metric(id,'--'));document.querySelector('#latencyQuality').textContent='等待数据';document.querySelector('#latencyPath').textContent='路径：等待 ICE 候选'}
function startDiagnostics(){resetDiagnostics();pingTimer=setInterval(()=>{if(dc?.readyState==='open')dc.send('ping|'+Date.now())},1000);statsTimer=setInterval(updateDiagnostics,1000);reportLogTimer=setInterval(reportDiagnostics,10000);updateDiagnostics();reportDiagnostics()}
async function updateDiagnostics(){if(!pc)return;try{let all=await pc.getStats(),inbound,pair,remoteCandidate,localCandidate;all.forEach(r=>{if(r.type==='inbound-rtp'&&r.kind==='video')inbound=r;if(r.type==='candidate-pair'&&r.state==='succeeded'&&(r.nominated||!pair))pair=r});if(pair){localCandidate=all.get(pair.localCandidateId);remoteCandidate=all.get(pair.remoteCandidateId)}let now=performance.now(),dt=lastStats?(now-lastStats.now)/1000:0,receivedDelta=lastStats&&inbound?inbound.packetsReceived-lastStats.received:0,lostDelta=lastStats&&inbound?inbound.packetsLost-lastStats.lost:0,totalDelta=receivedDelta+lostDelta,lossPct=totalDelta>0?Math.max(0,lostDelta)*100/totalDelta:0,bitrateKbps=lastStats&&inbound&&dt>0?(inbound.bytesReceived-lastStats.bytes)*8/dt/1000:0,fps=lastStats&&inbound&&dt>0?(inbound.framesDecoded-lastStats.frames)/dt:0,bufferCountDelta=lastStats&&inbound?(inbound.jitterBufferEmittedCount||0)-lastStats.bufferCount:0,bufferDelayDelta=lastStats&&inbound?(inbound.jitterBufferDelay||0)-lastStats.bufferDelay:0,bufferMs=bufferCountDelta>0?bufferDelayDelta/bufferCountDelta*1000:NaN,framesDelta=lastStats&&inbound?(inbound.framesDecoded||0)-lastStats.frames:0,decodeDelta=lastStats&&inbound?(inbound.totalDecodeTime||0)-lastStats.decodeTime:0,decodeMs=framesDelta>0?decodeDelta/framesDelta*1000:NaN,rtcMs=pair&&Number.isFinite(pair.currentRoundTripTime)?pair.currentRoundTripTime*1000:NaN,jitterMs=inbound&&Number.isFinite(inbound.jitter)?inbound.jitter*1000:NaN;metric('appRtt',Number.isFinite(appRttMs)?Math.round(appRttMs)+' ms':'--',level(appRttMs,120,250));metric('rtcRtt',Number.isFinite(rtcMs)?Math.round(rtcMs)+' ms':'--',level(rtcMs,120,250));metric('packetLoss',inbound&&lastStats?lossPct.toFixed(1)+'%':'--',level(lossPct,2,5));metric('jitter',Number.isFinite(jitterMs)?jitterMs.toFixed(1)+' ms':'--',level(jitterMs,20,50));metric('bitrate',inbound&&lastStats?Math.round(bitrateKbps)+' kbps':'--');metric('decodeFps',inbound&&lastStats?fps.toFixed(1)+' fps':'--',fps<15?'bad':fps<25?'warn':'good');metric('jitterBuffer',Number.isFinite(bufferMs)?Math.round(bufferMs)+' ms':'--',level(bufferMs,100,250));metric('decodeTime',Number.isFinite(decodeMs)?decodeMs.toFixed(1)+' ms':'--',level(decodeMs,20,40));let quality=!inbound?'等待视频':lossPct>=5||appRttMs>=250?'差':lossPct>=2||appRttMs>=120?'一般':'良好';document.querySelector('#latencyQuality').textContent=quality;document.querySelector('#latencyQuality').className=quality==='差'?'bad':quality==='一般'?'warn':quality==='良好'?'good':'';let lc=localCandidate?[localCandidate.candidateType,localCandidate.protocol,localCandidate.address||localCandidate.ip].filter(Boolean).join('/'):'?',rc=remoteCandidate?[remoteCandidate.candidateType,remoteCandidate.protocol,remoteCandidate.address||remoteCandidate.ip].filter(Boolean).join('/'):'?';document.querySelector('#latencyPath').textContent='WebRTC 路径：'+lc+' → '+rc;if(inbound)lastStats={now,received:inbound.packetsReceived,lost:inbound.packetsLost,bytes:inbound.bytesReceived,frames:inbound.framesDecoded||0,bufferCount:inbound.jitterBufferEmittedCount||0,bufferDelay:inbound.jitterBufferDelay||0,decodeTime:inbound.totalDecodeTime||0};if(pin&&inbound&&Math.floor(now/1000)%10===0)reportClient()}catch{}}
async function gather(p){if(p.iceGatheringState==='complete')return;await new Promise((ok,no)=>{let t=setTimeout(()=>no(Error('iPhone ICE 收集超时')),8000);p.addEventListener('icegatheringstatechange',()=>{if(p.iceGatheringState==='complete'){clearTimeout(t);ok()}})})}
async function reportClient(){if(!pc||!pin)return;let inbound,codec;try{let stats=await pc.getStats();stats.forEach(r=>{if(r.type==='inbound-rtp'&&r.kind==='video')inbound=r;if(r.type==='codec'&&/video\/H264/i.test(r.mimeType||''))codec=r});let body={ua:navigator.userAgent,ice:pc.iceConnectionState,connection:pc.connectionState,video:{width:video.videoWidth,height:video.videoHeight,readyState:video.readyState,currentTime:video.currentTime},inbound:inbound&&{packetsReceived:inbound.packetsReceived,packetsLost:inbound.packetsLost,bytesReceived:inbound.bytesReceived,framesReceived:inbound.framesReceived,framesDecoded:inbound.framesDecoded,keyFramesDecoded:inbound.keyFramesDecoded,framesDropped:inbound.framesDropped,jitter:inbound.jitter,decoderImplementation:inbound.decoderImplementation},codec:codec&&{mimeType:codec.mimeType,sdpFmtpLine:codec.sdpFmtpLine,payloadType:codec.payloadType}};fetch('/api/client-report?pin='+encodeURIComponent(pin),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).catch(()=>{})}catch{}}
async function reportDiagnostics(){if(!pc||!pin)return;try{let stats=await pc.getStats(),inbound,pair,localCandidate,remoteCandidate;stats.forEach(r=>{if(r.type==='inbound-rtp'&&r.kind==='video')inbound=r;if(r.type==='candidate-pair'&&r.state==='succeeded'&&(r.nominated||!pair))pair=r});if(pair){localCandidate=stats.get(pair.localCandidateId);remoteCandidate=stats.get(pair.remoteCandidateId)}let body={type:'realtime-diagnostics',ua:navigator.userAgent,ice:pc.iceConnectionState,connection:pc.connectionState,appRttMs,rtcRttMs:pair&&Number.isFinite(pair.currentRoundTripTime)?pair.currentRoundTripTime*1000:null,video:{width:video.videoWidth,height:video.videoHeight,currentTime:video.currentTime},inbound:inbound&&{packetsReceived:inbound.packetsReceived,packetsLost:inbound.packetsLost,bytesReceived:inbound.bytesReceived,framesReceived:inbound.framesReceived,framesDecoded:inbound.framesDecoded,framesDropped:inbound.framesDropped,jitter:inbound.jitter,jitterBufferDelay:inbound.jitterBufferDelay,jitterBufferEmittedCount:inbound.jitterBufferEmittedCount,totalDecodeTime:inbound.totalDecodeTime},path:{local:localCandidate&&{type:localCandidate.candidateType,protocol:localCandidate.protocol,address:localCandidate.address||localCandidate.ip},remote:remoteCandidate&&{type:remoteCandidate.candidateType,protocol:remoteCandidate.protocol,address:remoteCandidate.address||remoteCandidate.ip}}};fetch('/api/client-report?pin='+encodeURIComponent(pin),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).catch(()=>{})}catch{}}
async function connect(){pin=document.querySelector('#pin').value;if(pin.length<6||pin.length>64){show('请输入 6–64 位访问密码（原 6 位 PIN 仍兼容）');return}try{pc?.close();resetDiagnostics();reportTimers.forEach(clearTimeout);reportTimers=[];show('正在建立 WebRTC 直连…');pc=new RTCPeerConnection({iceServers:[]});pc.addTransceiver('video',{direction:'recvonly'});dc=pc.createDataChannel('control',{ordered:true});dc.onmessage=e=>{let m=String(e.data);if(m.startsWith('pong|')){let sent=Number(m.split('|')[1]);if(Number.isFinite(sent))appRttMs=Date.now()-sent}};dc.onopen=()=>{show('控制通道已连接，正在请求视频关键帧…');startDiagnostics();send('resetvideo');[1500,3500,6500].forEach(ms=>reportTimers.push(setTimeout(()=>{if(!video.videoWidth)send('resetvideo')},ms)))};pc.oniceconnectionstatechange=()=>show(`ICE: ${pc.iceConnectionState}\n连接: ${pc.connectionState}\n视频: ${video.videoWidth?video.videoWidth+'×'+video.videoHeight:'等待首帧'}`);pc.onconnectionstatechange=pc.oniceconnectionstatechange;pc.ontrack=e=>{video.srcObject=e.streams[0]||new MediaStream([e.track]);video.play().catch(x=>show('Safari 播放失败：'+x.message));clearTimeout(firstFrameTimer);firstFrameTimer=setTimeout(()=>{if(!video.videoWidth)show(`ICE: ${pc.iceConnectionState}\n已收到视频轨道，已重发关键帧请求，但仍未解码首帧`)},9000)};video.onplaying=()=>{clearTimeout(firstFrameTimer);login.style.display='none';orb.classList.add('online')};let offer=await pc.createOffer();await pc.setLocalDescription(offer);await gather(pc);let res=await fetch('/api/offer?pin='+encodeURIComponent(pin),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(pc.localDescription)});if(!res.ok)throw Error(await res.text());await pc.setRemoteDescription(await res.json());[2000,5000,9000].forEach(ms=>reportTimers.push(setTimeout(reportClient,ms)));show('WebRTC Answer 已设置，正在连接…')}catch(e){show('连接失败：'+e.message)}}
document.querySelector('#connect').onclick=connect;document.querySelector('#retry').onclick=()=>{pc?.close();resetDiagnostics();login.style.display='grid';menu.style.display='none';latencyPanel.style.display='none';orb.classList.remove('online');show('已断开，请重新连接')};orb.onclick=()=>menu.style.display=menu.style.display==='grid'?'none':'grid';document.querySelector('#latencyBtn').onclick=()=>{latencyPanel.style.display=latencyPanel.style.display==='block'?'none':'block';menu.style.display='none'};document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>send('key|'+b.dataset.key));document.querySelector('#wake').onclick=()=>send('wake');document.querySelector('#rotate').onclick=()=>send('rotate');document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen?.();
const kb=document.querySelector('#keyboard');document.querySelector('#keyboardBtn').onclick=()=>{kb.style.display='flex';document.querySelector('#text').focus()};document.querySelector('#closeKeyboard').onclick=()=>kb.style.display='none';document.querySelector('#sendText').onclick=()=>{let bytes=new TextEncoder().encode(document.querySelector('#text').value),raw='';bytes.forEach(x=>raw+=String.fromCharCode(x));send('paste|'+btoa(raw));kb.style.display='none'};
function xy(e){let r=video.getBoundingClientRect(),vw=video.videoWidth||r.width,vh=video.videoHeight||r.height,scale=Math.min(r.width/vw,r.height/vh),dw=vw*scale,dh=vh*scale,left=r.left+(r.width-dw)/2,top=r.top+(r.height-dh)/2;return{x:Math.max(0,Math.min(vw,Math.round((e.clientX-left)/scale))),y:Math.max(0,Math.min(vh,Math.round((e.clientY-top)/scale))),w:vw,h:vh}}
let active=new Map(),lastMove=0;video.addEventListener('pointerdown',e=>{e.preventDefault();video.setPointerCapture?.(e.pointerId);active.set(e.pointerId,true);let p=xy(e);send(`touch|0|${e.pointerId}|${p.x}|${p.y}|${p.w}|${p.h}|1|0`)});video.addEventListener('pointermove',e=>{if(!active.has(e.pointerId)||Date.now()-lastMove<20)return;e.preventDefault();lastMove=Date.now();let p=xy(e);send(`touch|2|${e.pointerId}|${p.x}|${p.y}|${p.w}|${p.h}|1|0`)});function up(e,cancel=false){if(!active.has(e.pointerId))return;e.preventDefault();active.delete(e.pointerId);let p=xy(e);send(`touch|${cancel?3:1}|${e.pointerId}|${p.x}|${p.y}|${p.w}|${p.h}|0|0`)}video.addEventListener('pointerup',e=>up(e));video.addEventListener('pointercancel',e=>up(e,true));
</script></body></html>
